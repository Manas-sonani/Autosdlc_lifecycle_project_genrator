# =========================================================
# APPLICATION
# =========================================================

spring.application.name=automated-sdlc


# =========================================================
# DATABASE - PostgreSQL
# =========================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/sdlc_db
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

# Automatically create/update database tables from @Entity classes
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console
spring.jpa.show-sql=true

# Format SQL queries so they are easier to read
spring.jpa.properties.hibernate.format_sql=true

# Tell Hibernate which database you are using
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# =========================================================
# DATABASE CONNECTION POOL - HikariCP
# =========================================================

# Maximum number of database connections
spring.datasource.hikari.maximum-pool-size=10

# Minimum number of idle connections
spring.datasource.hikari.minimum-idle=2

# Maximum time a connection can remain idle
#spring.datasource.hikari.idle-timeout=30000

# Maximum lifetime of a connection
#spring.datasource.hikari.max-lifetime=1800000


# =========================================================
# SERVER
# =========================================================

server.port=8080

# Surface the real exception message in 500 responses so failures are diagnosable
# instead of a bare "Internal Server Error". Stack trace only with ?trace=true.
server.error.include-message=always
server.error.include-stacktrace=on_trace_param


# =========================================================
# LLM PROVIDER POOL
# Add as many providers as you want under llm.providers.<name>.*.
# Each: type (openai | ollama), base-url, api-key, model.
# Then assign each agent an ordered fallback chain under llm.agents.<AgentType>.
# On 429 (rate/quota) or 5xx the call auto-falls back to the next provider in the chain.
# Add a new API = add a provider block + put its name in a chain. No code change.
# =========================================================

# --- Google Gemini API (OpenAI-compatible) ---
llm.providers.gemini.type=openai
llm.providers.gemini.base-url=https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
llm.providers.gemini.api-key=${GEMINI_API_KEY}
llm.providers.gemini.model=gemini-1.5-flash

# --- Groq key #1 (OpenAI-compatible) ---
llm.providers.groq1.type=openai
llm.providers.groq1.base-url=https://api.groq.com/openai/v1/chat/completions
llm.providers.groq1.api-key=${GROQ_API_KEY}
llm.providers.groq1.model=openai/gpt-oss-120b

# --- Groq key #2 (add another free-tier key to multiply quota) ---
#llm.providers.groq2.type=openai
#llm.providers.groq2.base-url=https://api.groq.com/openai/v1/chat/completions
#llm.providers.groq2.api-key=gsk_PUT_SECOND_GROQ_KEY_HERE
#llm.providers.groq2.model=openai/gpt-oss-120b

# --- OpenRouter or any other OpenAI-compatible provider (example) ---
#llm.providers.openrouter.type=openai
#llm.providers.openrouter.base-url=https://openrouter.ai/api/v1/chat/completions
#llm.providers.openrouter.api-key=sk-or-PUT_KEY_HERE
#llm.providers.openrouter.model=meta-llama/llama-3.3-70b-instruct

# --- Local Ollama (native /api/chat, thinking off; no token cap) ---
llm.providers.local.type=ollama
llm.providers.local.base-url=http://localhost:11434/api/chat
llm.providers.local.model=qwen3.5:4b
llm.providers.local.api-key=ollama

# =========================================================
# PER-AGENT FALLBACK CHAINS (tried left to right)
# =========================================================
# BA is light + benefits from speed -> Groq first, more Groq keys as backstop.
llm.agents.BUSINESS_ANALYST=gemini,groq1,local
# Architect is heavy (5 docs) -> Groq (fast) first, local Ollama as last-resort fallback.
llm.agents.DESIGNER=gemini,groq1,local
# Developer is the heaviest (5 layered code-gen calls) -> Groq first, local Ollama fallback.
llm.agents.DEVELOPER=gemini,groq1,local
# Tester generates 3 layers of tests (factories, unit, integration) -> Groq first, local fallback.
llm.agents.TESTER=gemini,groq1,local
# DevOps generates Dockerfile + docker-compose + GitHub Actions -> Groq first, local fallback.
llm.agents.DEVOPS=gemini,groq1,local


#docker rabbit mq
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin123}